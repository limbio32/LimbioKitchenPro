<!DOCTYPE html>
<html lang="ru">
    <head>
        <title>CSS - часть 6</title>
        <meta http-equiv="Content-type" content="text/html; charset=UTF-8">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="wrapper">
            <header class="header">
                <div class="header__top header-top">
                    <div class="header-top__brand">
                        <a href="" class="header-top__logo">
                            <img src="/img/header/logo-64.png" alt="">
                        </a>
                        <a href="#" class="header-top__brandname">
                            LimbioKitchenPro
                        </a>
                    </div>
                    <div class="header-top__search">
                        <input type="text" class="header-top__search-field" name="search_query">
                        <div class="header-top__search-button">
                            <img src="/img/header/find.svg" alt="">
                        </div>
                    </div>
                    <div class="header-top__icons">

                        <img src="/img/header/favorite.svg" alt="" class="header-top__favorite-icon">
                        <img src="/img/header/cart.svg" alt="" class="header-top__cart-icon">
                        <img src="/img/header/user.svg" alt="" class="header-top__user-icon">
                    </div>
                </div>
                <menu class="header__menu menu">
                    <div id="dishes"></div>
                </menu>
            </header>
            <main class="main">

            </main>
            <footer class="footer">

            </footer>
        </div>
        <script>
            async function loadDishes() {
                // запрос к REST API
                const response = await fetch('https://limbiokitchenpro.onrender.com/api/dishes');
                
                // превращаем ответ в JS объект
                const dishes = await response.json();

                // контейнер
                const container = document.getElementById('dishes');

                // выводим данные
                dishes.forEach(dishes => {
                    container.innerHTML += `
                        <div>
                            <h2>${dishes.name}</h2>
                            <p>${dishes.price}$</p>
                        </div>
                    `;
                });
            }

            loadDishes();

        </script>
    </body>
</html>
