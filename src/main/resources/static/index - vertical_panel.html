<!DOCTYPE html>
<html lang="ru">
    <head>
        <title>LimbioFoodPro - провайдер готовой еды</title>
        <meta http-equiv="Content-type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="wrapper">
            <div class="general">
                <header class="header header-mainpage">
                    <div class="header__top header-top">
                        <div class="header-top__brand">
                            <a href="" class="header-top__logo">
                                <img src="/img/header/logo-64.png" alt="">
                            </a>
                            <a href="#" class="header-top__brandname">
                                <p>LimbioKitchenPro</p> 
                            </a>
                        </div>
                        <div class="header-top__search">
                            <input type="text" class="header-top__search-field" name="search_query">
                            <button class="header-top__search-button">
                                <svg>
                                    <use href="/img/icons/sprite.svg#search"></use>
                                </svg>
                            </button>
                        </div>
                        <div class="header-top__icons">
                            <a href="" class="header-top__favorite-icon">
                                <svg>
                                    <use href="/img/icons/sprite.svg#favorite"></use>
                                </svg>
                            </a>
                            <a href="" class="header-top__cart-icon">
                                <svg>
                                    <use href="/img/icons/sprite.svg#cart"></use>
                                </svg>
                            </a>
                            <a href="" class="header-top__user-icon">
                                <svg>
                                    <use href="/img/icons/sprite.svg#user"></use>
                                </svg>
                            </a>
                        </div>
                    </div>
                    <menu class="header__menu menu">
                        <button class="menu__button">
                            <svg>
                                <use href="/img/icons/sprite.svg#menu"></use>
                            </svg>
                            МЕНЮ
                        </button>
                        <ul class="menu__items">
                            <li>
                                <a href="" class="menu__item">Главная</a>
                            </li>
                            <li>
                                <a href="" class="menu__item">О нас</a>
                            </li>
                            <li>
                                <a href="" class="menu__item">Отзывы</a>
                            </li>
                            <li>
                                <a href="" class="menu__item">Поддержка</a>
                            </li>
                            <li>
                                <a href="" class="menu__item">Контакты</a>
                            </li>
                        </ul>
                    </menu>
                </header>
                <div class="tags">
                    <button class="tag-button">Хит</button>
                    <button class="tag-button">Новинка</button>
                    <button class="tag-button">Акция</button>
                    <button class="tag-button">Бизнес-ланчи</button>
                    <button class="tag-button">Завтраки</button>
                    <button class="tag-button">Вегетарианское</button>
                    <button class="tag-button">Постное</button>
                    <button class="tag-button">На пару</button>
                    <button class="tag-button">Без сахара</button>
                </div>
                <main class="main">
                    <div class="cards">
    
                    </div>
                </main>
                <footer class="footer">
    
                </footer>
            </div>
            <div class="panel">
                <div class="panel__nav">
                    <button class="panel__dishes-catalog-button">
                        <svg>
                            <use href="/img/icons/sprite.svg#dishes_catalog"></use>
                        </svg>
                    </button>
                    <button class="panel__cart-button">
                        <svg>
                            <use href="/img/icons/sprite.svg#cart"></use>
                        </svg>
                    </button>
                    <button class="panel__favorite-button">
                        <svg>
                            <use href="/img/icons/sprite.svg#favorite"></use>
                        </svg>
                    </button>
                    <button class="panel__ration-button">
                        <svg>
                            <use href="/img/icons/sprite.svg#mealplan"></use>
                        </svg>
                    </button>
                </div>
                <div class="panel__main">
                    <div class="cart">
                        <div class="cart__items">

                        </div>
                    </div>
                    <div class="ration">
        
                    </div>
                    <div class="favorite">
                        
                    </div>
                </div>
                <div class="panel__order">
                    <div class="panel__total">
                        <p class="panel__total-label">Итого:</p>
                        <div class="panel__total-sum">
                            <span class="panel__total-sum-value">16.50</span>
                            <span>₾</span>
                        </div>
                    </div>
                    <button class="panel__formalize-order-button">ОФОРМИТЬ ЗАКАЗ</button>                
                </div>
            </div>
        </div>

        <div class="dishmenu">
            <div class="dishmenu__overlay">
                <div class="dishmenu__box">
                    <div class="dishmenu__header">
                        <button class="dishmenu__left-arrow">
                            <svg>
                                <use href="/img/icons/sprite.svg#left_arrow"></use>
                            </svg>
                        </button>
                        <button class="dishmenu__right-arrow">
                            <svg>
                                <use href="/img/icons/sprite.svg#left_arrow"></use>
                            </svg>
                        </button>
                        <div class="dishmenu__nav-text">ГЛАВНАЯ</div>
                        <button class="dishmenu__close">
                            <svg>
                                <use href="/img/icons/sprite.svg#cross"></use>
                            </svg>
                        </button>
                    </div>
                    <div class="dishmenu__main">
                        <div class="dishmenu__items">
                            <div class="dishmenu__item">
                                <div class="dishmenu__item-box1">
                                    <div class="dishmenu__item-box2">
                                        <div class="dishmenu__img-box dishmenu__img-box1"></div>
                                        <h2 class="dishmenu__title">Супы</h2>
                                    </div>
                                </div>
                            </div>
                            <div class="dishmenu__item">
                                <div class="dishmenu__item-box1">
                                    <div class="dishmenu__item-box2">
                                        <div class="dishmenu__img-box dishmenu__img-box2"></div>
                                        <h2 class="dishmenu__title">Завтраки</h2>
                                    </div>
                                </div>
                            </div>
                            <div class="dishmenu__item">
                                <div class="dishmenu__item-box1">
                                    <div class="dishmenu__item-box2">
                                        <div class="dishmenu__img-box dishmenu__img-box3"></div>
                                        <h2 class="dishmenu__title">Хлебобулочные изделия</h2>
                                    </div>
                                </div>
                            </div>
                            <div class="dishmenu__item">
                                <div class="dishmenu__item-box1">
                                    <div class="dishmenu__item-box2">
                                        <div class="dishmenu__img-box dishmenu__img-box4"></div>
                                        <h2 class="dishmenu__title">Десерты</h2>
                                    </div>
                                </div>
                            </div>
                            <div class="dishmenu__item">
                                <div class="dishmenu__item-box1">
                                    <div class="dishmenu__item-box2">
                                        <div class="dishmenu__img-box dishmenu__img-box5"></div>
                                        <h2 class="dishmenu__title">Горячие блюда</h2>
                                    </div>
                                </div>
                            </div>
                            <div class="dishmenu__item">
                                <div class="dishmenu__item-box1">
                                    <div class="dishmenu__item-box2">
                                        <div class="dishmenu__img-box dishmenu__img-box6"></div>
                                        <h2 class="dishmenu__title">Салаты</h2>
                                    </div>
                                </div>
                            </div>
                            <div class="dishmenu__item">
                                <div class="dishmenu__item-box1">
                                    <div class="dishmenu__item-box2">
                                        <div class="dishmenu__img-box dishmenu__img-box7"></div>
                                        <h2 class="dishmenu__title">Напитки</h2>
                                    </div>
                                </div>
                            </div>
                            <div class="dishmenu__item">
                                <div class="dishmenu__item-box1">
                                    <div class="dishmenu__item-box2">
                                        <div class="dishmenu__img-box dishmenu__img-box8"></div>
                                        <h2 class="dishmenu__title">Соусы и заправки</h2>
                                    </div>
                                </div>
                            </div>
                            <div class="dishmenu__item">
                                <div class="dishmenu__item-box1">
                                    <div class="dishmenu__item-box2">
                                        <div class="dishmenu__img-box dishmenu__img-box9"></div>
                                        <h2 class="dishmenu__title">Гарниры</h2>
                                    </div>
                                </div>
                            </div>
                            <div class="dishmenu__item">
                                <div class="dishmenu__item-box1">
                                    <div class="dishmenu__item-box2">
                                        <div class="dishmenu__img-box dishmenu__img-box10"></div>
                                        <h2 class="dishmenu__title">Наборы</h2>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        
        <template class="card_template">
            <div class="card">
                <div class="card__box1">
                    <div class="card__box2">
                        <div class="card__photo"></div>
                        <div class="card__weight-price">
                            <div class="card__weight">
                                <span class="card__weight-value">120</span>
                                <span class="card__weight-unit">г</span>
                            </div>
                            <div class="card__price">
                                <span class="card__price-value">3.00</span>
                                <span class="card__price-unit">₾</span>
                            </div>
                        </div>
                        <div class="card__dishname">
                            <p>Суп с мясом классический с грибами</p>
                        </div>
                        <div class="card__dishcontrol dishcontrol">
                            <div class="dishcontrol__quantity-control">
                                <button class="dishcontrol__minus-button">
                                    <svg>
                                        <use href="/img/icons/sprite.svg#minus"></use>
                                    </svg>
                                </button>
                                <div class="dishcontrol__quantity">
                                    <input type="number" name="quantity" class="dishcontrol__quantity-input" value="0" min="0">
                                </div>
                                <button class="dishcontrol__plus-button">
                                    <svg>
                                        <use href="/img/icons/sprite.svg#plus"></use>
                                    </svg>
                                </button>
                                <button class="dishcontrol__measure-unit">
                                    <p>шт</p> 
                                    <svg>
                                        <use href="/img/icons/sprite.svg#chevron_down"></use>
                                    </svg>
                                </button>
                            </div>
                            <div class="dishcontrol__total">
                                <p class="dishcontrol__total-text">Итого:</p>
                                <p class="dishcontrol__total-price">
                                    <span class="dishcontrol__total-price-value">0.00</span>
                                    <span class="dishcontrol__total-price-unit">₾</span>
                                </p>
                            </div>
                            <div class="dishcontrol__line"></div>  
                            <div class="dishcontrol__actions">
                                <a href="#" class="dishcontrol__add-to-favourite">
                                    <svg>
                                        <use href="/img/icons/sprite.svg#favorite"></use>
                                    </svg>
                                </a>
                                <a href="#" class="dishcontrol__add-to-mealplan">
                                    <svg>
                                        <use href="/img/icons/sprite.svg#mealplan"></use>
                                    </svg>
                                </a>
                                <button class="dishcontrol__in-cart-button">
                                    В корзину
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <template class="dish-item-mini_template">
            <div class="dish-item-mini">
                <div class="dish-item-mini__top">
                    <div class="dish-item-mini__img-box">
                        <button class="dish-item-mini__close-button">
                            <svg>
                                <use href="/img/icons/sprite.svg#cross"></use>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="dish-item-mini__dishname">
                    Суп с мясом классический с грибами
                </div>
                <div class="dish-item-mini__numbers">
                    <button class="dish-item-mini__change-quantity-button">
                        <span class="dish-item-mini__quantity">1</span>
                        <span> x </span>
                        <span class="dish-item-mini__price-snapshot">3.00</span> 
                    </button>
                    <div class="dish-item-mini__total">
                        <span class="dish-item-mini__sum">6.00</span> 
                        <span>₾</span>
                    </div>
                </div>
            </div>        
        </template>

        <template class="dishpage_template">
            <div class="dishpage">
                <div class="dishpage__main">
                    <div class="dishpage__img-box"></div>
                    <div class="dishpage__weight-price">
                        <div class="dishpage__weight">
                            <span class="dishpage__weight-value">120</span>
                            <span class="dishpage__weight-unit">г</span>
                        </div>
                        <div class="dishpage__nav">
                            <div class="dishpage__nav-item"></div>
                        </div>
                        <div class="dishpage__price">
                            <span class="dishpage__price-value">3.00</span>
                            <span class="dishpage__price-unit">₾</span>
                        </div>
                    </div>
                    <div class="dishpage__dishname">
                        Суп с мясом классический с грибами
                    </div>
                    <div class="dishpage__description">
                        <p>
                            Нежный молочный суп — вкус, знакомый с детства. Лёгкий, согревающий и по-домашнему уютный: ароматное молоко, отборная вермишель и щепотка заботы в каждой ложке. Идеальный выбор для тех, кто хочет насладиться простым и полезным блюдом, которое дарит чувство комфорта и сытости. Попробуйте — иногда именно самые простые вкусы становятся любимыми.
                        </p>
                    </div>
                </div>
                <div class="dishpage__addition">
                    <div class="dishpage__nutritional-value nutritional-value">
                        <div class="nutritional-value__label">Пищевая ценность:</div>
                        <div class="nutritional-value__box">
                            <table class="nutritional-value__table">
                                <tr class="nutritional-value_string">
                                    <th class="nutritional-value__name">Белки:</th>
                                    <td class="nutritional-value__weight">
                                        <span class="nutritional-value__value">50</span>
                                        <span class="nutritional-value__unit">г</span>
                                    </td>
                                </tr>
                                <tr class="nutritional-value_string">
                                    <th class="nutritional-value__name">Жиры:</th>
                                    <td class="nutritional-value__weight">
                                        <span class="nutritional-value__value">75</span>
                                        <span class="nutritional-value__unit">г</span>
                                    </td>
                                </tr>
                                <tr class="nutritional-value_string">
                                    <th class="nutritional-value__name">Углеводы:</th>
                                    <td class="nutritional-value__weight">
                                        <span class="nutritional-value__value">80</span>
                                        <span class="nutritional-value__unit">г</span>
                                    </td>
                                </tr>
                                <tr class="nutritional-value_string">
                                    <th class="nutritional-value__name">Калории:</th>
                                    <td class="nutritional-value__weight">
                                        <span class="nutritional-value__value">430</span>
                                        <span class="nutritional-value__unit">ккал</span>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </div>
                    <div class="dishpage__composition dish-composition">
                        <div class="dish-composition__label">Состав:</div>
                        <div class="dish-composition__box">
                            <ul class="dish-composition__list">
                                <li class="dish-composition__item">курица</li>
                                <li class="dish-composition__item">картофель</li>
                                <li class="dish-composition__item">лук</li>
                                <li class="dish-composition__item">морковь</li>
                                <li class="dish-composition__item">грибы</li>
                                <li class="dish-composition__item">сельдерей</li>
                            </ul>
                        </div>
                    </div>
                    <div class="dishpage__dishcontrol dishcontrol">
                        <div class="dishcontrol__quantity-control">
                            <button class="dishcontrol__minus-button">
                                <svg>
                                    <use href="/img/icons/sprite.svg#minus"></use>
                                </svg>
                            </button>
                            <div class="dishcontrol__quantity">
                                <input type="number" name="quantity" class="dishcontrol__quantity-input" value="0" min="0">
                            </div>
                            <button class="dishcontrol__plus-button">
                                <svg>
                                    <use href="/img/icons/sprite.svg#plus"></use>
                                </svg>
                            </button>
                            <button class="dishcontrol__measure-unit">
                                <p>шт</p> 
                                <svg>
                                    <use href="/img/icons/sprite.svg#chevron_down"></use>
                                </svg>
                            </button>
                        </div>
                        <div class="dishcontrol__total">
                            <p class="dishcontrol__total-text">Итого:</p>
                            <p class="dishcontrol__total-price">
                                <span class="dishcontrol__total-price-value">0.00</span>
                                <span class="dishcontrol__total-price-unit">₾</span>
                            </p>
                        </div>
                        <div class="dishcontrol__line"></div>  
                        <div class="dishcontrol__actions">
                            <a href="#" class="dishcontrol__add-to-favourite">
                                <svg>
                                    <use href="/img/icons/sprite.svg#favorite"></use>
                                </svg>
                            </a>
                            <a href="#" class="dishcontrol__add-to-mealplan">
                                <svg>
                                    <use href="/img/icons/sprite.svg#mealplan"></use>
                                </svg>
                            </a>
                            <button class="dishcontrol__in-cart-button">
                                В корзину
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </template>        

        <script src="/js/main.js">
        </script>

    </body>
</html>
